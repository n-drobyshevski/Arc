name: Android

on:
  pull_request:
    paths-ignore:
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Official Gradle action: dependency caching and wrapper validation.
      - uses: gradle/actions/setup-gradle@v4

      # The runner provides ANDROID_HOME; AGP downloads platform 37 and
      # build-tools 37 itself once the licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Live's native audio engine (app/src/main/cpp) needs the NDK and CMake
      # versions app/build.gradle.kts names. AGP would fetch them too; installing
      # them here keeps that out of the build and fails early if one is gone.
      # The engine's host test (part of ./gradlew test) uses the runner's g++/clang++.
      - name: Install the NDK and CMake
        run: |
          ndk="$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          cmake="$(sed -n 's/^ *version = "\([0-9.]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$ndk" -a -n "$cmake" || { echo "::error::ndkVersion or the CMake version not found in app/build.gradle.kts"; exit 1; }
          echo "NDK $ndk, CMake $cmake"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Test, lint and build
        run: ./gradlew test :app:lintDebug :app:assembleDebug --stacktrace

      # Every debug build is signed with app/debug.keystore, so test builds
      # install over each other. Fail if that ever stops being true.
      - name: Check the APK is signed with the shared debug key
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          certs="$("$tools/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          echo "$certs"
          grep -q "SHA-256 digest: 156dde54a742795f0dcccd03c5ff6cb0d1efd344de8aa8eea6095d3a70793fc0" <<< "$certs"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
